name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  GO_VERSION: "1.23"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      go: ${{ steps.filter.outputs.go }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'services/shortener-api/**'
              - '.github/workflows/ci.yml'
            go:
              - 'services/redirector/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'monitoring/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  # ------------------------------------------------------------------ Java
  java:
    name: Java · lint, unit, integration
    needs: changes
    if: needs.changes.outputs.java == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shortener-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Format check (Spotless)
        run: mvn -B -q spotless:check
      - name: Unit + integration tests (Surefire, then Failsafe with Testcontainers)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            services/shortener-api/target/surefire-reports
            services/shortener-api/target/failsafe-reports
            services/shortener-api/target/site/jacoco
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Go
  go:
    name: Go · lint, vet, test (-race)
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/redirector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/redirector/go.sum
      - name: Verify module checksums
        run: go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: services/redirector
      - name: Tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Benchmarks (smoke)
        run: go test -run=^$ -bench=. -benchtime=200ms ./internal/hashring/

  # ------------------------------------------------------------------ cross-language conformance
  conformance:
    name: Hash-ring conformance vectors are identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java and Go must load the same vectors
        run: |
          cmp services/shortener-api/src/test/resources/ring-vectors.json \
              services/redirector/internal/hashring/testdata/ring-vectors.json
      - name: Lua token-bucket script is identical in both services
        run: |
          cmp services/shortener-api/src/main/resources/lua/token_bucket.lua \
              services/redirector/internal/ratelimit/token_bucket.lua

  # ------------------------------------------------------------------ infra
  infra:
    name: Terraform fmt/validate · Prometheus rules · compose config
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff
      - name: terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=infra/terraform --init && tflint --chdir=infra/terraform
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.0 check rules /etc/prometheus/alert-rules.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.0 check config /etc/prometheus/prometheus.yml
      - name: amtool check config
        run: docker run --rm -v "$PWD/monitoring:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
      - name: docker compose config
        run: docker compose config -q

  # ------------------------------------------------------------------ containers
  images:
    name: Build images · Trivy scan
    needs: [java, go]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [shortener-api, redirector]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ------------------------------------------------------------------ end-to-end
  e2e:
    name: End-to-end smoke test (docker compose)
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Short load test (SLO thresholds)
        run: |
          docker run --rm --network host -e BASE_URL=http://localhost:8081 -e API_URL=http://localhost:8080 \
            -e RATE=200 -e DURATION=30s -e POOL=50 -e P95_MS=100 -e P99_MS=250 \
            -v "$PWD/loadtest/k6:/lt" -w /lt grafana/k6:0.54.0 run /lt/redirect.js
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Tear down
        if: always()
        run: docker compose down -v
