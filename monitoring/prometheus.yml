global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: shortener-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shortener-api:8080"]
        labels: { service: shortener-api }

  - job_name: redirector
    metrics_path: /metrics
    static_configs:
      - targets: ["redirector:8081"]
        labels: { service: redirector }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
