receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  # Local: print spans so traces are visible in `docker compose logs otel-collector`.
  debug:
    verbosity: basic
  # AWS: swap for awsxray or an OTLP backend (Tempo/Jaeger/Honeycomb).
  # awsxray:
  #   region: us-west-2

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
