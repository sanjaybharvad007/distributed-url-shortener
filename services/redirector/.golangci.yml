version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - bodyclose
    - gosec
    - revive
  settings:
    gosec:
      excludes:
        - G104 # handled by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/urlshortener/redirector
