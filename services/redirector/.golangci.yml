run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - gosec
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/urlshortener/redirector
  gosec:
    excludes:
      - G104 # handled by errcheck

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck, bodyclose]
